name: Build Twoyi

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi

    - name: Install Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r22b
        add-to-path: false

    - name: Install cargo-xdk
      run: cargo install cargo-xdk

    - name: Configure cargo-xdk
      run: |
        mkdir -p ~/.cargo-xdk
        cat > ~/.cargo-xdk/config.toml << 'EOF'
        [android.ndk]
        path = "$ANDROID_NDK_HOME"
        version = "22"
        [android.ndk.arm64]
        target = "aarch64-linux-android"
        api-level = "27"
        [android.ndk.arm]
        target = "armv7-linux-androideabi"
        api-level = "27"
        EOF

    - name: Build Rust native library (${{ matrix.arch }})
      run: |
        cd app/rs
        if [ "${{ matrix.arch }}" = "arm64-v8a" ]; then
          cargo xdk build --target arm64
        else
          cargo xdk build --target arm
        fi

    - name: Copy Rust .so to jniLibs
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/jniLibs/armeabi-v7a
        if [ -f app/rs/target/aarch64-linux-android/release/libtwoyi.so ]; then
          cp app/rs/target/aarch64-linux-android/release/libtwoyi.so app/src/main/jniLibs/arm64-v8a/
        fi
        if [ -f app/rs/target/armv7-linux-androideabi/release/libtwoyi.so ]; then
          cp app/rs/target/armv7-linux-androideabi/release/libtwoyi.so app/src/main/jniLibs/armeabi-v7a/
        fi

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: twoyi-${{ matrix.arch }}
        path: app/build/outputs/apk/debug/*.apk