name: Release Twoyi

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.1)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: |
          aarch64-linux-android
          armv7-linux-androideabi

    - name: Install Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r22b
        add-to-path: false

    - name: Install cargo-xdk
      run: cargo install cargo-xdk

    - name: Configure cargo-xdk
      run: |
        mkdir -p ~/.cargo-xdk
        cat > ~/.cargo-xdk/config.toml << 'EOF'
        [android.ndk]
        path = "$ANDROID_NDK_HOME"
        version = "22"
        [android.ndk.arm64]
        target = "aarch64-linux-android"
        api-level = "27"
        [android.ndk.arm]
        target = "armv7-linux-androideabi"
        api-level = "27"
        EOF

    - name: Build Rust native library (arm64)
      run: |
        cd app/rs
        cargo xdk build --target arm64 --release

    - name: Build Rust native library (arm)
      run: |
        cd app/rs
        cargo xdk build --target arm --release

    - name: Copy Rust .so to jniLibs
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/jniLibs/armeabi-v7a
        cp app/rs/target/aarch64-linux-android/release/libtwoyi.so app/src/main/jniLibs/arm64-v8a/
        cp app/rs/target/armv7-linux-androideabi/release/libtwoyi.so app/src/main/jniLibs/armeabi-v7a/

    - name: Build universal APK
      run: |
        # Build for both architectures
        sed -i 's/splits {/splits {\n        universalApk true/' app/build.gradle 2>/dev/null || true
        ./gradlew assembleDebug

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/debug
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: "Twoyi Enhanced ${{ github.event.inputs.version }}"
        body: |
          ## Twoyi Enhanced Edition

          ### Features
          - Home Launcher with status dashboard
          - Magisk module manager
          - Enhanced package importer (XAPK/APKM/APKS support)
          - Touch input optimization (fixed ghost touches)
          - ROM extraction optimization with caching
          - Boot optimization scripts

          ### Installation
          1. Download the APK for your architecture
          2. Install as regular APK
          3. Open the app - new Home Launcher will appear
        files: |
          app/build/outputs/apk/debug/*.apk
        draft: true
        prerelease: false